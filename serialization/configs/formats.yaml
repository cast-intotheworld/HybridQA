# Serialization format definitions
# Each format defines a serializer class and its parameters

formats:
  json:
    class: "JSONSerializer"
    description: "Structured JSON preserving original table/passage hierarchy"
    params:
      indent: 2
      include_metadata: true

  yaml:
    class: "YAMLSerializer"
    description: "YAML preserving original table/passage hierarchy"
    params:
      default_flow_style: false
      include_metadata: true

  xml:
    class: "XMLSerializer"
    description: "XML preserving original table/passage hierarchy"
    params:
      indent: 2
      include_metadata: true

  markdown:
    class: "MarkdownSerializer"
    description: "Markdown table with linked passages"
    params:
      passage_format: "paragraph"

  html:
    class: "HTMLSerializer"
    description: "HTML table with linked passages"
    params:
      passage_format: "paragraph"

  latex:
    class: "LaTeXSerializer"
    description: "LaTeX tabular environment with passages"
    params:
      col_spec: ""  # empty = auto ("l" * num_cols)

  csv:
    class: "CSVSerializer"
    description: "CSV (RFC 4180) with passages appended as plain text"
    params:
      delimiter: ","
      include_title: true

# Default format for quick testing
default_format: "json"
